<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verde — Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-auth">
  <div class="auth-frame">
    <main class="auth-card">
      <h1 class="logo-serif logo-card">Verde</h1>
      <div class="logo-rule"></div>
      <form id="signup-form" class="auth-form" novalidate>
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" placeholder="O seu nome" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="········" minlength="6" required>
        </div>
        <div class="field">
          <label for="password2">Confirmar senha</label>
          <input type="password" id="password2" name="password2" placeholder="········" minlength="6" required>
        </div>
        <p class="form-error" id="signup-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-pill btn-wide">Criar conta</button>
      </form>
      <p class="auth-footer">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </p>
    </main>
  </div>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'menu.html';

    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const err = document.getElementById('signup-error');
      err.hidden = true;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        err.textContent = 'As palavras-passe não coincidem.';
        err.hidden = false;
        return;
      }
      const result = Auth.register(name, email, password);
      if (result.ok) {
        window.location.href = 'menu.html';
      } else {
        err.textContent = result.message;
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
