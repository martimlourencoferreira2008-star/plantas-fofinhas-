<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verde — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-auth">
  <div class="auth-frame">
    <main class="auth-card">
      <h1 class="logo-serif logo-card">Verde</h1>
      <div class="logo-rule"></div>
      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field field-row">
          <label for="password">Senha</label>
          <a href="#" class="field-link" id="forgot-link">Esqueceu a senha?</a>
          <input type="password" id="password" name="password" placeholder="········" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="login-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-pill btn-wide">Entrar</button>
      </form>
      <p class="auth-footer">
        Ainda não tem uma conta?
        <a href="signup.html">Criar conta</a>
      </p>
    </main>
  </div>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'menu.html';

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.hidden = true;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result = Auth.login(email, password);
      if (result.ok) {
        window.location.href = 'menu.html';
      } else {
        err.textContent = result.message;
        err.hidden = false;
      }
    });

    document.getElementById('forgot-link').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Contacte o suporte ou registe uma nova conta com o mesmo email (funcionalidade demonstrativa).');
    });
  </script>
</body>
</html>
